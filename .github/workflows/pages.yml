name: 소개 페이지 배포
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/check-public-seo.mjs', 'test/seo.test.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 공개 SEO 회귀 검사
        run: node --test test/seo.test.mjs
      - name: 배포 파일 검색 정보 검사
        run: npm run check:seo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: 공개 소개 페이지 배포
        id: deployment
        uses: actions/deploy-pages@v4
